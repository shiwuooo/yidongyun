<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内容访问</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .icon {
            font-size: 80px;
            margin-bottom: 25px;
            display: block;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 26px;
        }
        p {
            color: #555;
            line-height: 1.7;
            margin-bottom: 20px;
            font-size: 16px;
        }
        .notice {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            border-radius: 8px;
            padding: 18px;
            margin: 25px 0;
            text-align: left;
        }
        .steps {
            text-align: left;
            margin: 20px 0;
        }
        .steps li {
            margin-bottom: 12px;
            color: #555;
        }
        .loading {
            display: none;
            margin: 30px 0;
        }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 电脑端显示内容 -->
        <div id="desktopView">
            <span class="icon">📵</span>
            <h1></h1>
            <p>以防和谐，仅限手机端访问=</p>
            
            <div class="notice">
                <strong>访问说明：</strong>
                <p>为了提供最佳体验，本资源仅限手机端访问。</p>
            </div>
            
            <div class="steps">
                <p><strong>请按以下步骤操作：</strong></p>
                <ol>
                    <li>复制本链接打开手机端中国移动云盘，即可自动弹出</li>
                    <li>若未弹出 复制本链接到手机浏览器，会自动跳转至中国移动云盘</li>
                    <li></li>
                </ol>
            </div>
            
            <p style="color: #7f8c8d; font-size: 14px; margin-top: 25px;">
                如果您正在使用手机但看到此提示，请尝试刷新页面或更换浏览器
            </p>
        </div>
        
        <!-- 手机端加载提示 -->
        <div id="mobileView" style="display: none;">
            <span class="icon">📱</span>
            <h1>正在准备内容</h1>
            <p>请稍候，正在为您加载...</p>
            
            <div class="loading" id="loadingIndicator">
                <div class="loader"></div>
                <p style="text-align: center; margin-top: 15px;">加载中</p>
            </div>
        </div>
    </div>

    <script>
        // 设备检测函数
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }
        
        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            if (isMobileDevice()) {
                // 手机设备：显示加载界面，然后跳转
                document.getElementById('desktopView').style.display = 'none';
                document.getElementById('mobileView').style.display = 'block';
                document.getElementById('loadingIndicator').style.display = 'block';
                
                // 短暂延迟后跳转，让用户看到加载界面
                setTimeout(function() {
                    // 这里直接使用您的夸克网盘链接
                    window.location.href = "https://yun.139.com/shareweb/#/w/i/2qidYzbrgh6uu";
                }, 1500);
                
            } else {
                // 电脑设备：只显示提示页面，不暴露任何链接信息
                document.getElementById('desktopView').style.display = 'block';
                document.getElementById('mobileView').style.display = 'none';
            }
        });
    </script>
</body>
</html>
